<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core PA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #131315;
    --panel-hi: #1c1c1f;
    --line: #2a2a2e;
    --chrome-hi: #e8e8ea;
    --chrome-mid: #9a9aa0;
    --text: #eceded;
    --text-dim: #8a8a90;
    --pink: #ff2d78;
    --pink-dim: #ff2d7833;
    --green: #30d158;
    --green-dim: #30d15833;
    --amber: #ffd60a;
    --amber-dim: #ffd60a33;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% -10%, rgba(255,45,120,0.08), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(255,255,255,0.04), transparent 40%);
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 18px 120px;
    padding-top: max(28px, env(safe-area-inset-top));
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .core-mark {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--chrome-hi), var(--chrome-mid) 60%, #333 100%);
    box-shadow: 0 0 0 1px var(--line), 0 0 14px rgba(255,45,120,0.25);
    flex-shrink: 0;
  }

  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  .status-pill {
    font-family: 'Fira Code', monospace;
    font-size: 11px; color: var(--text-dim);
    display: flex; align-items: center; gap: 6px;
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
  .dot.linked { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 4px;
    margin-bottom: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
  }

  .tab {
    flex: 1; padding: 8px;
    font-family: 'Fira Code', monospace;
    font-size: 12px; font-weight: 500;
    text-align: center; cursor: pointer;
    border: none; background: transparent;
    color: var(--text-dim); border-radius: 7px;
    transition: background 0.15s, color 0.15s;
  }

  .tab.active { background: var(--panel-hi); color: var(--text); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  /* ── Banner ── */
  .banner {
    font-size: 12.5px; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
    margin-bottom: 18px; line-height: 1.5;
  }
  .banner code { color: var(--pink); font-family: 'Fira Code', monospace; }

  /* ── Capture ── */
  .capture {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px; margin-bottom: 26px;
  }

  .capture textarea {
    width: 100%; background: transparent; border: none; resize: none;
    color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 15px; line-height: 1.5; outline: none; min-height: 44px;
  }
  .capture textarea::placeholder { color: var(--text-dim); }

  .capture-controls {
    display: flex; align-items: center;
    justify-content: space-between; gap: 10px;
    margin-top: 10px; padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .capture-opts { display: flex; gap: 8px; flex-wrap: wrap; }

  .opt-btn {
    font-family: 'Fira Code', monospace; font-size: 11.5px;
    color: var(--text-dim); background: var(--panel-hi);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .opt-btn:hover { color: var(--text); border-color: var(--chrome-mid); }
  .opt-btn.active { color: var(--pink); border-color: var(--pink-dim); background: rgba(255,45,120,0.06); }

  select, input[type="datetime-local"] {
    font-family: 'Fira Code', monospace; font-size: 11.5px;
    background: var(--panel-hi); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; color: var(--text); outline: none;
  }

  .send-btn {
    background: var(--chrome-hi); color: #0a0a0a;
    border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; flex-shrink: 0;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .send-btn:hover { box-shadow: 0 0 14px rgba(255,45,120,0.3); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  .row-extra {
    display: none; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .row-extra.open { display: flex; }

  /* ── Section label ── */
  .section-label {
    font-family: 'Fira Code', monospace; font-size: 11px;
    text-transform: lowercase; color: var(--text-dim);
    margin: 22px 0 10px; letter-spacing: 0.02em;
  }

  /* ── Task card ── */
  .task {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 14px; margin-bottom: 8px;
    display: flex; align-items: flex-start; gap: 12px;
    transition: border-color 0.15s;
  }
  .task:hover { border-color: #3a3a3e; }
  .task.priority-high  { border-left: 3px solid var(--pink); }
  .task.priority-low   { border-left: 3px solid #3a3a3e; }

  .check {
    width: 19px; height: 19px; border-radius: 50%;
    border: 1.5px solid var(--chrome-mid); flex-shrink: 0;
    margin-top: 1px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .check:hover { border-color: var(--pink); }
  .check.done { background: var(--pink); border-color: var(--pink); }
  .check.done::after {
    content: '';
    width: 5px; height: 9px;
    border-right: 2px solid #0a0a0a;
    border-bottom: 2px solid #0a0a0a;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .task-body { flex: 1; min-width: 0; }

  .task-title { font-size: 14.5px; line-height: 1.4; word-break: break-word; }
  .task.done .task-title { color: var(--text-dim); text-decoration: line-through; }

  .task-meta {
    font-family: 'Fira Code', monospace; font-size: 10.5px;
    color: var(--text-dim); margin-top: 5px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }

  .badge {
    font-family: 'Fira Code', monospace; font-size: 10px;
    border-radius: 5px; padding: 2px 6px; font-weight: 500;
  }
  .badge-high    { background: var(--pink-dim);  color: var(--pink); }
  .badge-low     { background: #2a2a2e;           color: var(--text-dim); }
  .badge-recurring { background: var(--amber-dim); color: var(--amber); }
  .badge-remind  { color: var(--green); }

  .del-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 2px 4px;
    line-height: 1; opacity: 0.5;
    transition: opacity 0.15s, color 0.15s;
  }
  .del-btn:hover { opacity: 1; color: var(--pink); }

  .empty {
    color: var(--text-dim); font-size: 13px; text-align: center;
    padding: 30px 0; font-family: 'Fira Code', monospace;
  }

  /* ── Finance tab ── */
  .fin-summary {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px; margin-bottom: 20px;
  }

  .fin-stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 12px; text-align: center;
  }
  .fin-stat .label {
    font-family: 'Fira Code', monospace; font-size: 10px;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .fin-stat .value { font-size: 16px; font-weight: 600; }
  .fin-stat.income .value  { color: var(--green); }
  .fin-stat.expense .value { color: var(--pink); }
  .fin-stat.net .value     { color: var(--chrome-hi); }

  .fin-capture {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 24px;
  }

  .fin-row {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
  }

  .fin-input {
    font-family: 'Inter', sans-serif; font-size: 14px;
    background: var(--panel-hi); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; color: var(--text);
    outline: none; flex: 1; min-width: 80px;
  }
  .fin-input::placeholder { color: var(--text-dim); }
  .fin-input:focus { border-color: var(--chrome-mid); }

  .type-toggle {
    display: flex; gap: 4px;
  }
  .type-btn {
    font-family: 'Fira Code', monospace; font-size: 11.5px;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; background: var(--panel-hi);
    color: var(--text-dim); transition: all 0.15s;
  }
  .type-btn.active-expense { color: var(--pink);  border-color: var(--pink-dim);  background: rgba(255,45,120,0.06); }
  .type-btn.active-income  { color: var(--green); border-color: var(--green-dim); background: rgba(48,209,88,0.06); }

  .fin-entry {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; margin-bottom: 7px;
    display: flex; align-items: center; gap: 10px;
  }

  .fin-entry .amount {
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .fin-entry.income-entry  .amount { color: var(--green); }
  .fin-entry.expense-entry .amount { color: var(--pink); }

  .fin-entry .details { flex: 1; min-width: 0; }
  .fin-entry .cat {
    font-family: 'Fira Code', monospace; font-size: 10.5px;
    color: var(--text-dim);
  }
  .fin-entry .note-text { font-size: 13px; }

  .fin-entry .fin-del {
    background: none; border: none; color: var(--text-dim);
    font-size: 15px; cursor: pointer; opacity: 0.4; padding: 2px 4px;
    transition: opacity 0.15s, color 0.15s;
  }
  .fin-entry .fin-del:hover { opacity: 1; color: var(--pink); }

  .cat-breakdown {
    margin-top: 18px;
  }

  .cat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-row .cat-name {
    font-family: 'Fira Code', monospace; font-size: 11px; color: var(--text-dim);
  }
  .cat-row .cat-amt { font-weight: 500; color: var(--pink); }

  /* ── Chat tab ── */
  .chat-log {
    max-height: 380px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
    padding-right: 2px;
  }

  .chat-empty {
    color: var(--text-dim);
    font-size: 12.5px;
    font-family: 'Fira Code', monospace;
    text-align: center;
    padding: 24px 0;
  }

  .msg {
    max-width: 88%;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--chrome-hi);
    color: #0a0a0a;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel-hi);
    border: 1px solid var(--line);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.thinking {
    align-self: flex-start;
    color: var(--text-dim);
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    padding: 6px 4px;
  }

  .chat-input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .chat-input-row textarea {
    flex: 1;
    background: var(--panel-hi);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 20px;
    max-height: 120px;
  }
  .chat-input-row textarea::placeholder { color: var(--text-dim); }
  .chat-input-row textarea:focus { border-color: var(--chrome-mid); }

  .reset-link {
    background: none; border: none;
    color: var(--text-dim);
    font-family: 'Fira Code', monospace;
    font-size: 10.5px; cursor: pointer;
    padding: 8px 0 0; text-align: right;
    display: block; width: 100%; opacity: 0.7;
    transition: opacity 0.15s, color 0.15s;
  }
  .reset-link:hover { opacity: 1; color: var(--pink); }

  .no-key-notice {
    font-family: 'Fira Code', monospace;
    font-size: 12px; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; text-align: center;
    line-height: 1.6;
  }
  .no-key-notice code { color: var(--pink); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="core-mark"></div>
      <h1>core pa</h1>
    </div>
    <div class="status-pill" id="statusPill">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">checking…</span>
    </div>
  </header>

  <div class="banner" id="linkBanner" style="display:none;">
    not linked to telegram yet — open your bot and send <code>/start</code>.
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="tasks">tasks</button>
    <button class="tab" data-tab="finance">finance</button>
    <button class="tab" data-tab="chat">chat</button>
  </div>

  <!-- ── Tasks tab ── -->
  <div class="tab-panel active" id="tab-tasks">

    <div class="capture">
      <textarea id="input" placeholder="what needs to happen…" rows="1"></textarea>
      <div class="capture-controls">
        <div class="capture-opts">
          <button class="opt-btn" id="whenBtn" type="button">+ remind</button>
          <button class="opt-btn" id="moreBtn" type="button">+ options</button>
        </div>
        <button class="send-btn" id="sendBtn" type="button">add</button>
      </div>
      <div class="row-extra" id="whenRow">
        <input type="datetime-local" id="remindAt">
      </div>
      <div class="row-extra" id="moreRow">
        <select id="prioritySelect">
          <option value="normal" selected>normal priority</option>
          <option value="high">🔴 high priority</option>
          <option value="low">low priority</option>
        </select>
        <select id="staleSelect">
          <option value="1">nudge after 1d</option>
          <option value="3" selected>nudge after 3d</option>
          <option value="7">nudge after 7d</option>
        </select>
        <select id="recurringSelect">
          <option value="" selected>not recurring</option>
          <option value="daily">repeats daily</option>
          <option value="weekly">repeats weekly</option>
          <option value="monthly">repeats monthly</option>
        </select>
      </div>
    </div>

    <div class="section-label">open</div>
    <div id="openList"></div>

    <div class="section-label" id="doneLabel" style="display:none;">done</div>
    <div id="doneList"></div>

  </div>

  <!-- ── Finance tab ── -->
  <div class="tab-panel" id="tab-finance">

    <div class="fin-summary">
      <div class="fin-stat income">
        <div class="label">income</div>
        <div class="value" id="finIncome">R0</div>
      </div>
      <div class="fin-stat expense">
        <div class="label">spent</div>
        <div class="value" id="finExpense">R0</div>
      </div>
      <div class="fin-stat net">
        <div class="label">net</div>
        <div class="value" id="finNet">R0</div>
      </div>
    </div>

    <div class="fin-capture">
      <div class="fin-row">
        <div class="type-toggle">
          <button class="type-btn active-expense" id="typeExpense" type="button">expense</button>
          <button class="type-btn" id="typeIncome" type="button">income</button>
        </div>
        <input class="fin-input" id="finAmount" type="number" min="0.01" step="0.01" placeholder="amount (R)">
      </div>
      <div class="fin-row">
        <select class="fin-input" id="finCategory" style="flex:0 0 auto;">
          <option value="food">food</option>
          <option value="transport">transport</option>
          <option value="bills">bills</option>
          <option value="income">income</option>
          <option value="general" selected>general</option>
          <option value="other">other</option>
        </select>
        <input class="fin-input" id="finNote" type="text" placeholder="note (optional)">
        <button class="send-btn" id="finAddBtn" type="button">add</button>
      </div>
    </div>

    <div class="section-label">this month</div>

    <div class="cat-breakdown" id="catBreakdown"></div>

    <div class="section-label" id="finEntriesLabel" style="display:none;">entries</div>
    <div id="finList"></div>

  </div>

  <!-- ── Chat tab ── -->
  <div class="tab-panel" id="tab-chat">

    <div id="noKeyNotice" class="no-key-notice" style="display:none;">
      add <code>ANTHROPIC_API_KEY</code> to your <code>.env</code> to enable the reasoning assistant.
    </div>

    <div id="chatLog" class="chat-log">
      <div class="chat-empty">talk it through — anything you want to reason on.</div>
    </div>

    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="say something…" rows="1"></textarea>
      <button class="send-btn" id="chatSendBtn" type="button">send</button>
    </div>
    <button class="reset-link" id="chatResetBtn" type="button">reset conversation</button>

  </div>

</div>

<script>
const API = '';
let finType = 'expense';

// ── DOM refs ──────────────────────────────────────────────────────────────────
const input          = document.getElementById('input');
const sendBtn        = document.getElementById('sendBtn');
const whenBtn        = document.getElementById('whenBtn');
const moreBtn        = document.getElementById('moreBtn');
const whenRow        = document.getElementById('whenRow');
const moreRow        = document.getElementById('moreRow');
const remindAt       = document.getElementById('remindAt');
const staleSelect    = document.getElementById('staleSelect');
const prioritySelect = document.getElementById('prioritySelect');
const recurringSelect= document.getElementById('recurringSelect');
const openList       = document.getElementById('openList');
const doneList       = document.getElementById('doneList');
const doneLabel      = document.getElementById('doneLabel');
const statusDot      = document.getElementById('statusDot');
const statusText     = document.getElementById('statusText');
const linkBanner     = document.getElementById('linkBanner');

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
    if (tab.dataset.tab === 'finance') loadFinance();
  });
});
// ── Auto-grow textarea ────────────────────────────────────────────────────────
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
});

// ── Toggle extra rows ─────────────────────────────────────────────────────────
whenBtn.addEventListener('click', () => {
  whenRow.classList.toggle('open');
  whenBtn.classList.toggle('active');
});

moreBtn.addEventListener('click', () => {
  moreRow.classList.toggle('open');
  moreBtn.classList.toggle('active');
});

// ── Status ────────────────────────────────────────────────────────────────────
async function loadStatus() {
  try {
    const res = await fetch(`${API}/api/status`);
    const data = await res.json();
    if (data.telegramLinked) {
      statusDot.classList.add('linked');
      statusText.textContent = 'linked';
      linkBanner.style.display = 'none';
    } else {
      statusText.textContent = 'not linked';
      linkBanner.style.display = 'block';
    }
  } catch { statusText.textContent = 'offline'; }
}

// ── Formatting helpers ────────────────────────────────────────────────────────
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 3600)  return `${Math.max(1, Math.floor(diff / 60))}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function formatRemind(iso) {
  return new Date(iso).toLocaleString(undefined, {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── Tasks ─────────────────────────────────────────────────────────────────────
async function loadTasks() {
  const res = await fetch(`${API}/api/tasks`);
  const tasks = await res.json();

  const open = tasks.filter(t => t.status === 'open');
  const done = tasks.filter(t => t.status === 'done');

  openList.innerHTML = open.length ? '' : '<div class="empty">nothing open. clean slate.</div>';
  open.forEach(t => openList.appendChild(renderTask(t)));

  doneLabel.style.display = done.length ? 'block' : 'none';
  doneList.innerHTML = '';
  done.slice(0, 8).forEach(t => doneList.appendChild(renderTask(t)));
}

function renderTask(t) {
  const el = document.createElement('div');
  el.className = `task priority-${t.priority} ${t.status === 'done' ? 'done' : ''}`;

  const badges = [];
  if (t.priority === 'high') badges.push(`<span class="badge badge-high">high</span>`);
  if (t.priority === 'low')  badges.push(`<span class="badge badge-low">low</span>`);
  if (t.recurring)           badges.push(`<span class="badge badge-recurring">↻ ${t.recurring}</span>`);

  const meta = [];
  if (t.remind_at && t.status === 'open') {
    meta.push(`<span class="badge-remind">⏰ ${formatRemind(t.remind_at)}</span>`);
  }
  meta.push(`touched ${timeAgo(t.last_touched_at)}`);

  el.innerHTML = `
    <div class="check ${t.status === 'done' ? 'done' : ''}"></div>
    <div class="task-body">
      <div class="task-title">${escapeHtml(t.title)}</div>
      <div class="task-meta">
        ${badges.join('')}
        ${meta.join('<span style="opacity:0.4">·</span>')}
      </div>
    </div>
    <button class="del-btn" aria-label="delete">×</button>
  `;

  el.querySelector('.check').addEventListener('click', async () => {
    await fetch(`${API}/api/tasks/${t.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: t.status === 'open' ? 'done' : 'open', touch: true })
    });
    loadTasks();
  });

  el.querySelector('.del-btn').addEventListener('click', async () => {
    await fetch(`${API}/api/tasks/${t.id}`, { method: 'DELETE' });
    loadTasks();
  });

  return el;
}

async function addTask() {
  const title = input.value.trim();
  if (!title) return;
  sendBtn.disabled = true;

  const payload = {
    title,
    priority:   prioritySelect.value,
    stale_days: parseInt(staleSelect.value, 10),
    recurring:  recurringSelect.value || null,
  };

  if (whenRow.classList.contains('open') && remindAt.value) {
    payload.remind_at = new Date(remindAt.value).toISOString();
  }

  await fetch(`${API}/api/tasks`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  input.value = '';
  input.style.height = 'auto';
  whenRow.classList.remove('open');
  moreRow.classList.remove('open');
  whenBtn.classList.remove('active');
  moreBtn.classList.remove('active');
  remindAt.value = '';
  prioritySelect.value = 'normal';
  recurringSelect.value = '';
  sendBtn.disabled = false;
  loadTasks();
}

sendBtn.addEventListener('click', addTask);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTask(); }
});

// ── Finance ───────────────────────────────────────────────────────────────────
const typeExpenseBtn = document.getElementById('typeExpense');
const typeIncomeBtn  = document.getElementById('typeIncome');
const finAmount      = document.getElementById('finAmount');
const finCategory    = document.getElementById('finCategory');
const finNote        = document.getElementById('finNote');
const finAddBtn      = document.getElementById('finAddBtn');
const finIncome      = document.getElementById('finIncome');
const finExpense     = document.getElementById('finExpense');
const finNet         = document.getElementById('finNet');
const finList        = document.getElementById('finList');
const catBreakdown   = document.getElementById('catBreakdown');
const finEntriesLabel= document.getElementById('finEntriesLabel');

typeExpenseBtn.addEventListener('click', () => {
  finType = 'expense';
  typeExpenseBtn.className = 'type-btn active-expense';
  typeIncomeBtn.className  = 'type-btn';
});

typeIncomeBtn.addEventListener('click', () => {
  finType = 'income';
  typeIncomeBtn.className  = 'type-btn active-income';
  typeExpenseBtn.className = 'type-btn';
});

async function loadFinance() {
  const res = await fetch(`${API}/api/finance`);
  const { entries, totals, byCategory } = await res.json();

  const income  = totals.find(r => r.type === 'income')?.total  || 0;
  const expense = totals.find(r => r.type === 'expense')?.total || 0;
  const net     = income - expense;

  finIncome.textContent  = `R${income.toFixed(2)}`;
  finExpense.textContent = `R${expense.toFixed(2)}`;
  finNet.textContent     = `${net >= 0 ? '+' : ''}R${net.toFixed(2)}`;
  finNet.style.color     = net >= 0 ? 'var(--green)' : 'var(--pink)';

  // category breakdown
  const expCats = byCategory.filter(r => r.type === 'expense');
  catBreakdown.innerHTML = expCats.length
    ? expCats.map(c => `
        <div class="cat-row">
          <span class="cat-name">${escapeHtml(c.category)}</span>
          <span class="cat-amt">R${c.total.toFixed(2)}</span>
        </div>`).join('')
    : '<div class="empty" style="padding:16px 0">no spend logged this month.</div>';

  // entries list
  finEntriesLabel.style.display = entries.length ? 'block' : 'none';
  finList.innerHTML = '';
  entries.slice(0, 30).forEach(e => finList.appendChild(renderFinEntry(e)));
}

function renderFinEntry(e) {
  const el = document.createElement('div');
  el.className = `fin-entry ${e.type}-entry`;

  const sign = e.type === 'income' ? '+' : '-';
  const date = new Date(e.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  el.innerHTML = `
    <div class="amount">${sign}R${parseFloat(e.amount).toFixed(2)}</div>
    <div class="details">
      <div class="note-text">${escapeHtml(e.note || e.category)}</div>
      <div class="cat">${escapeHtml(e.category)} · ${date}</div>
    </div>
    <button class="fin-del" aria-label="delete">×</button>
  `;

  el.querySelector('.fin-del').addEventListener('click', async () => {
    await fetch(`${API}/api/finance/${e.id}`, { method: 'DELETE' });
    loadFinance();
  });

  return el;
}

async function addFinEntry() {
  const amount = parseFloat(finAmount.value);
  if (!amount || amount <= 0) { finAmount.focus(); return; }

  finAddBtn.disabled = true;
  await fetch(`${API}/api/finance`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type:     finType,
      amount,
      category: finCategory.value,
      note:     finNote.value.trim() || null,
    })
  });

  finAmount.value = '';
  finNote.value   = '';
  finAddBtn.disabled = false;
  loadFinance();
}

finAddBtn.addEventListener('click', addFinEntry);
finAmount.addEventListener('keydown', e => {
  if (e.key === 'Enter') addFinEntry();
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadStatus();
loadTasks();
setInterval(loadTasks, 15000);

// ── Chat ──────────────────────────────────────────────────────────────────────
const chatLog      = document.getElementById('chatLog');
const chatInput    = document.getElementById('chatInput');
const chatSendBtn  = document.getElementById('chatSendBtn');
const chatResetBtn = document.getElementById('chatResetBtn');
const noKeyNotice  = document.getElementById('noKeyNotice');

chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = chatInput.scrollHeight + 'px';
});

function appendMsg(role, text) {
  const empty = chatLog.querySelector('.chat-empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  chatLog.appendChild(el);
  chatLog.scrollTop = chatLog.scrollHeight;
  return el;
}

async function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;

  appendMsg('user', text);
  chatInput.value = '';
  chatInput.style.height = 'auto';
  chatSendBtn.disabled = true;

  const thinking = document.createElement('div');
  thinking.className = 'msg thinking';
  thinking.textContent = 'thinking…';
  chatLog.appendChild(thinking);
  chatLog.scrollTop = chatLog.scrollHeight;

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    thinking.remove();
    if (res.status === 503) {
      noKeyNotice.style.display = 'block';
      appendMsg('assistant', 'no API key set — add ANTHROPIC_API_KEY to your .env to use the chat.');
    } else {
      appendMsg('assistant', res.ok ? data.reply : `error: ${data.error || 'something went wrong'}`);
    }
  } catch {
    thinking.remove();
    appendMsg('assistant', 'connection error — try again.');
  }

  chatSendBtn.disabled = false;
}

chatSendBtn.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

chatResetBtn.addEventListener('click', async () => {
  await fetch(`${API}/api/chat/reset`, { method: 'POST' });
  chatLog.innerHTML = '<div class="chat-empty">talk it through — anything you want to reason on.</div>';
  noKeyNotice.style.display = 'none';
});

if ('serviceWorker' in navigator) {
  // PWA installable — offline caching can be added in v3
}
</script>
